<!DOCTYPE html>
<html>

<head>
    <title>Forgot Password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">

    <style>

        body{
            background:linear-gradient(135deg,#04142d,#6610f2);
            min-height:100vh;
        }

        .forgot-card{
            border:none;
            border-radius:30px;
            overflow:hidden;
        }

        .forgot-header{
            background:linear-gradient(135deg,#0d6efd,#6610f2);
            color:white;
            text-align:center;
            padding:35px;
        }

        .form-control{
            border-radius:12px;
            padding:14px;
        }

        .form-control:focus{
            box-shadow:0 0 15px rgba(13,110,253,0.35);
            border-color:#0d6efd;
        }

        .send-btn{
            border-radius:12px;
            padding:14px;
            font-size:17px;
            font-weight:bold;
        }

        .mail-icon{
            font-size:80px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="row justify-content-center align-items-center"
         style="min-height:100vh;">

        <div class="col-lg-6">

            <div class="card forgot-card shadow-lg">

                <div class="forgot-header">

                    <div class="mail-icon">
                        📧
                    </div>

                    <h2 class="mt-3">
                        Forgot Password
                    </h2>

                    <p class="mb-0">
                        Enter your registered email to receive an OTP.
                    </p>

                </div>

                <div class="card-body p-5">

                    <form method="POST">

                        <label class="form-label fw-bold">
                            Email Address
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control mb-4"
                            placeholder="Enter your registered email"
                            required>

                        <button
                            type="submit"
                            class="btn btn-primary send-btn w-100">

                            📩 Send OTP

                        </button>

                    </form>

                    <a href="/login"
                       class="btn btn-secondary w-100 mt-3">

                        ← Back to Login

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
