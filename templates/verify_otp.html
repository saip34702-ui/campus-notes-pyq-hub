<!DOCTYPE html>
<html>

<head>
    <title>Verify OTP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">

    <style>

        body{
            background:linear-gradient(135deg,#04142d,#6610f2);
            min-height:100vh;
        }

        .otp-card{
            border:none;
            border-radius:30px;
            overflow:hidden;
        }

        .otp-header{
            background:linear-gradient(135deg,#198754,#0d6efd);
            color:white;
            text-align:center;
            padding:35px;
        }

        .otp-icon{
            font-size:80px;
        }

        .form-control{
            border-radius:12px;
            padding:14px;
            text-align:center;
            font-size:22px;
            letter-spacing:5px;
            font-weight:bold;
        }

        .form-control:focus{
            box-shadow:0 0 15px rgba(13,110,253,0.35);
            border-color:#0d6efd;
        }

        .verify-btn{
            border-radius:12px;
            padding:14px;
            font-size:17px;
            font-weight:bold;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="row justify-content-center align-items-center"
         style="min-height:100vh;">

        <div class="col-lg-5">

            <div class="card otp-card shadow-lg">

                <div class="otp-header">

                    <div class="otp-icon">
                        🔐
                    </div>

                    <h2 class="mt-3">
                        Verify OTP
                    </h2>

                    <p class="mb-0">
                        Enter the OTP sent to your email.
                    </p>

                </div>

                <div class="card-body p-5">

                    <form method="POST">

                        <label class="form-label fw-bold">
                            Enter OTP
                        </label>

                        <input
                            type="text"
                            name="otp"
                            maxlength="6"
                            class="form-control mb-4"
                            placeholder="000000"
                            required>

                        <button
                            type="submit"
                            class="btn btn-success verify-btn w-100">

                            ✅ Verify OTP

                        </button>

                    </form>

                    <a href="/forgot_password"
                       class="btn btn-secondary w-100 mt-3">

                        ← Back

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
