<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Student Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">

<style>

body{
    min-height:100vh;
    background:linear-gradient(135deg,#198754,#0d6efd);
}

.navbar{
    box-shadow:0 4px 15px rgba(0,0,0,0.2);
}

.register-card{
    background:rgba(255,255,255,0.95);
    border:none;
    border-radius:30px;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
    overflow:hidden;
}

.left-side{
    background:linear-gradient(135deg,#198754,#0d6efd);
    color:white;
    padding:50px 35px;
    height:100%;
}

.logo-icon{
    font-size:80px;
}

.form-control,
.form-select{
    border-radius:12px;
    padding:14px;
}

.form-control:focus,
.form-select:focus{
    box-shadow:0 0 15px rgba(13,110,253,0.35);
    border-color:#0d6efd;
}

.btn-register{
    border-radius:12px;
    padding:13px;
    font-size:17px;
    font-weight:bold;
}

.feature{
    margin-top:15px;
}

.feature i{
    margin-right:10px;
}

.password-strength{
    height:8px;
    border-radius:10px;
    background:#dee2e6;
    overflow:hidden;
    margin-top:10px;
}

.password-fill{
    height:100%;
    width:0%;
    transition:0.4s;
}

@media(max-width:768px){

    .left-side{
        display:none;
    }

}

</style>

</head>

<body>

<nav class="navbar navbar-dark bg-success">

<div class="container">

<a class="navbar-brand fw-bold" href="/">
📚 Campus Notes & PYQ Hub
</a>

</div>

</nav>

<div class="container">

<div class="row justify-content-center align-items-center"
     style="min-height:90vh; padding-top:60px; padding-bottom:60px;">

<div class="col-lg-10">

<div class="card register-card">

<div class="row g-0">

<div class="col-md-5">

<div class="left-side d-flex flex-column justify-content-center">

<div class="text-center">

<div class="logo-icon">
🎓
</div>

<h2 class="fw-bold mt-3">
Join Campus Hub
</h2>

<p class="mt-3">
Create your account and access Notes,
PYQs and Study Resources.
</p>

</div>

<div class="feature">
<i class="fas fa-book"></i>
Access Notes & PYQs
</div>

<div class="feature">
<i class="fas fa-upload"></i>
Upload Study Material
</div>

<div class="feature">
<i class="fas fa-bell"></i>
Receive Notifications
</div>

<div class="feature">
<i class="fas fa-users"></i>
Student Community
</div>

</div>

</div>

<div class="col-md-7">

<div class="p-5">

<div class="text-center mb-4">

<h2 class="fw-bold">
Create Account 🚀
</h2>

<p class="text-muted">
Start your learning journey
</p>

</div>

<form method="POST">

<div class="mb-3">

<label class="form-label fw-semibold">
Full Name
</label>

<input
type="text"
name="name"
class="form-control"
placeholder="Enter your full name"
required>

</div>

<div class="mb-3">

<label class="form-label fw-semibold">
Email Address
</label>

<input
type="email"
name="email"
class="form-control"
placeholder="Enter your email"
required>

</div>

<div class="mb-3">

<label class="form-label fw-semibold">
Password
</label>

<input
type="password"
id="password"
name="password"
class="form-control"
placeholder="Create password"
required>

<div class="password-strength">
    <div class="password-fill"
         id="strengthBar">
    </div>
</div>

</div>

<div class="mb-3">

<label class="form-label fw-semibold">
Confirm Password
</label>

<input
type="password"
id="confirmPassword"
class="form-control"
placeholder="Confirm password"
required>

</div>

<div class="form-check mb-3">

<input
class="form-check-input"
type="checkbox"
id="showPassword">

<label
class="form-check-label"
for="showPassword">

Show Password

</label>

</div>

<div class="mb-4">

<label class="form-label fw-semibold">
Academic Year
</label>

<select
name="year"
class="form-select">

<option value="FY">
FY - First Year
</option>

<option value="SY">
SY - Second Year
</option>

<option value="TY">
TY - Third Year
</option>

</select>

</div>

<div class="form-check mb-4">

<input
class="form-check-input"
type="checkbox"
required>

<label class="form-check-label">

I agree to the Terms & Conditions.

</label>

</div>

<button
type="submit"
class="btn btn-success btn-register w-100">

<i class="fas fa-user-plus me-2"></i>
Create Account

</button>

</form>

<hr>

<p class="text-center mb-0">

Already have an account?

<a href="/login"
   class="fw-bold text-decoration-none">

Login Here

</a>

</p>

</div>

</div>

</div>

</div>

</div>

</div>

</div>

<script>

document.getElementById("showPassword")
.addEventListener("change", function(){

    let p1 =
        document.getElementById("password");

    let p2 =
        document.getElementById("confirmPassword");

    if(this.checked){
        p1.type = "text";
        p2.type = "text";
    }
    else{
        p1.type = "password";
        p2.type = "password";
    }

});

document.getElementById("password")
.addEventListener("input", function(){

    let value = this.value;
    let bar =
        document.getElementById("strengthBar");

    if(value.length < 4){
        bar.style.width = "30%";
        bar.style.background = "red";
    }
    else if(value.length < 8){
        bar.style.width = "60%";
        bar.style.background = "orange";
    }
    else{
        bar.style.width = "100%";
        bar.style.background = "green";
    }

});

document.querySelector("form")
.addEventListener("submit", function(e){

    let p1 =
        document.getElementById("password").value;

    let p2 =
        document.getElementById("confirmPassword").value;

    if(p1 !== p2){

        e.preventDefault();

        alert("Passwords do not match.");

    }

});

</script>

</body>
</html>
