<!DOCTYPE html>
<html>

<head>
    <title>Change Password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">

    <style>

        body{
            background:linear-gradient(135deg,#04142d,#6610f2);
            min-height:100vh;
        }

        .password-card{
            border:none;
            border-radius:30px;
            overflow:hidden;
        }

        .card-header-custom{
            background:linear-gradient(135deg,#0d6efd,#6610f2);
            color:white;
            text-align:center;
            padding:35px;
        }

        .form-control{
            border-radius:12px;
            padding:14px;
        }

        .form-control:focus{
            box-shadow:0 0 15px rgba(13,110,253,0.35);
            border-color:#0d6efd;
        }

        .change-btn{
            border-radius:12px;
            padding:14px;
            font-size:17px;
            font-weight:bold;
        }

        .password-strength{
            height:8px;
            border-radius:10px;
            background:#dee2e6;
            overflow:hidden;
            margin-top:10px;
        }

        .strength-fill{
            height:100%;
            width:0%;
            transition:0.4s;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="row justify-content-center align-items-center"
         style="min-height:100vh;">

        <div class="col-lg-6">

            <div class="card password-card shadow-lg">

                <div class="card-header-custom">

                    <h2>
                        🔒 Change Password
                    </h2>

                    <p class="mb-0">
                        Keep your account secure
                    </p>

                </div>

                <div class="card-body p-5">

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                New Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter new password"
                                required>

                            <div class="password-strength">
                                <div class="strength-fill"
                                     id="strengthBar">
                                </div>
                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                id="confirmPassword"
                                class="form-control"
                                placeholder="Confirm password"
                                required>

                        </div>

                        <div class="form-check mb-4">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="showPassword">

                            <label
                                class="form-check-label"
                                for="showPassword">

                                Show Password

                            </label>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success change-btn w-100">

                            🔒 Change Password

                        </button>

                        <a href="/settings"
                           class="btn btn-secondary w-100 mt-3">

                            ← Back to Settings

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

document.getElementById("showPassword")
.addEventListener("change", function(){

    let p1 =
        document.getElementById("password");

    let p2 =
        document.getElementById("confirmPassword");

    if(this.checked){
        p1.type = "text";
        p2.type = "text";
    }
    else{
        p1.type = "password";
        p2.type = "password";
    }

});

document.getElementById("password")
.addEventListener("input", function(){

    let value = this.value;
    let bar =
        document.getElementById("strengthBar");

    if(value.length < 4){
        bar.style.width = "30%";
        bar.style.background = "red";
    }
    else if(value.length < 8){
        bar.style.width = "60%";
        bar.style.background = "orange";
    }
    else{
        bar.style.width = "100%";
        bar.style.background = "green";
    }

});

document.querySelector("form")
.addEventListener("submit", function(e){

    let p1 =
        document.getElementById("password").value;

    let p2 =
        document.getElementById("confirmPassword").value;

    if(p1 !== p2){

        e.preventDefault();

        alert("Passwords do not match.");

    }

});

</script>

</body>
</html>
