<!DOCTYPE html>
<html>
<head>
    <title>{{ year }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
</head>

<body class="bg-light">

<div class="container text-center mt-5">

    <h1>{{ year }}</h1>

    <div class="row mt-5">

{% if year == "FY" %}

<div class="col-md-6">
    <div class="card shadow p-4">
        <h3>Semester 1</h3>

        <a href="/{{ category }}/FY/sem1"
           class="btn btn-primary mt-3">
            Open
        </a>
    </div>
</div>

<div class="col-md-6">
    <div class="card shadow p-4">
        <h3>Semester 2</h3>

        <a href="/{{ category }}/FY/sem2"
           class="btn btn-primary mt-3">
            Open
        </a>
    </div>
</div>

{% elif year == "SY" %}

<div class="col-md-6">
    <div class="card shadow p-4">
        <h3>Semester 3</h3>

        <a href="/{{ category }}/SY/sem3"
           class="btn btn-primary mt-3">
            Open
        </a>
    </div>
</div>

<div class="col-md-6">
    <div class="card shadow p-4">
        <h3>Semester 4</h3>

        <a href="/{{ category }}/SY/sem4"
           class="btn btn-primary mt-3">
            Open
        </a>
    </div>
</div>

{% elif year == "TY" %}

<div class="col-md-6">
    <div class="card shadow p-4">
        <h3>Semester 5</h3>

        <a href="/{{ category }}/TY/sem5"
           class="btn btn-primary mt-3">
            Open
        </a>
    </div>
</div>

<div class="col-md-6">
    <div class="card shadow p-4">
        <h3>Semester 6</h3>

        <a href="/{{ category }}/TY/sem6"
           class="btn btn-primary mt-3">
            Open
        </a>
    </div>
</div>

{% endif %}

</div>

    

</div>

</body>
</html>
